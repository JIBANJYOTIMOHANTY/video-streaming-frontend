<div class="max-w-3xl mx-auto px-4 py-16">
  <div class="bg-[#121426]/50 backdrop-blur-xl border border-white/5 rounded-3xl overflow-hidden shadow-2xl">
    <!-- Header Banner Accent -->
    <div class="h-32 bg-gradient-to-r from-violet-600 to-indigo-650 relative"></div>

    <!-- User Information -->
    <div class="px-8 pb-8 relative">
      <!-- Profile Avatar -->
      <div class="absolute -top-12 left-8 h-24 w-24 rounded-2xl bg-gradient-to-tr from-violet-500 to-fuchsia-500 border-4 border-[#0b0c16] flex items-center justify-center text-white font-black text-3xl shadow-xl uppercase">
        {{ user()?.username?.charAt(0) }}
      </div>

      <div class="pt-16 space-y-6">
        <div>
          <h1 class="text-2xl sm:text-3xl font-extrabold text-white">{{ user()?.username }}</h1>
          <p class="text-slate-400 text-sm font-semibold mt-0.5">Content Creator & Developer</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-6 border-t border-white/5">
          <div class="bg-[#0c0e1b]/40 border border-white/5 p-5 rounded-2xl space-y-1">
            <span class="text-xs font-bold text-violet-400 uppercase tracking-wider">Email Address</span>
            <div class="text-white font-bold text-base mt-1">{{ user()?.email }}</div>
          </div>

          <div class="bg-[#0c0e1b]/40 border border-white/5 p-5 rounded-2xl space-y-1">
            <span class="text-xs font-bold text-violet-400 uppercase tracking-wider">Total Uploaded Videos</span>
            <div class="text-white font-black text-2xl flex items-center gap-2 mt-1">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-fuchsia-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
              </svg>
              {{ totalVideosCount() }}
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
