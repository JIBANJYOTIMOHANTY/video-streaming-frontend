<div class="min-h-screen flex items-center justify-center bg-slate-50 dark:bg-radial dark:from-slate-900 dark:via-slate-950 dark:to-black px-4 py-12 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-white dark:bg-slate-900/60 backdrop-blur-xl border border-slate-200 dark:border-slate-800 p-8 rounded-2xl shadow-lg dark:shadow-2xl">
    <div>
      <div class="flex justify-center">
        <div class="h-12 w-12 rounded-xl bg-gradient-to-tr from-violet-600 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/20">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
          </svg>
        </div>
      </div>
      <h2 class="mt-6 text-center text-3xl font-extrabold tracking-tight text-slate-900 dark:text-white">
        Create Account
      </h2>
      <p class="mt-2 text-center text-sm text-slate-500 dark:text-slate-400">
        Join us and start sharing your videos today
      </p>
    </div>

    @if (errorMessage()) {
      <div class="bg-red-500/10 border border-red-500/20 text-red-650 dark:text-red-400 px-4 py-3 rounded-lg text-sm flex items-center gap-2 animate-bounce">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    @if (successMessage()) {
      <div class="bg-emerald-500/10 border border-emerald-500/20 text-emerald-600 dark:text-emerald-400 px-4 py-3 rounded-lg text-sm flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0 animate-bounce" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>{{ successMessage() }}</span>
      </div>
    }

    <form class="mt-8 space-y-4" (ngSubmit)="onSubmit()">
      <div class="space-y-3">
        <div>
          <label for="username" class="block text-sm font-semibold text-slate-700 dark:text-slate-300">Username</label>
          <input
            id="username"
            name="username"
            type="text"
            required
            [(ngModel)]="username"
            class="mt-1 block w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-slate-900 dark:text-white placeholder-slate-450 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent transition-all"
            placeholder="JohnDoe"
          />
        </div>
        <div>
          <label for="email-address" class="block text-sm font-semibold text-slate-700 dark:text-slate-300">Email Address</label>
          <input
            id="email-address"
            name="email"
            type="email"
            required
            [(ngModel)]="email"
            class="mt-1 block w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-slate-900 dark:text-white placeholder-slate-450 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent transition-all"
            placeholder="you@example.com"
          />
        </div>
        <div>
          <label for="password" class="block text-sm font-semibold text-slate-700 dark:text-slate-300">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            required
            [(ngModel)]="password"
            class="mt-1 block w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-slate-900 dark:text-white placeholder-slate-450 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent transition-all"
            placeholder="••••••••"
          />
        </div>
        <div>
          <label for="confirm-password" class="block text-sm font-semibold text-slate-700 dark:text-slate-300">Confirm Password</label>
          <input
            id="confirm-password"
            name="confirmPassword"
            type="password"
            required
            [(ngModel)]="confirmPassword"
            class="mt-1 block w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-slate-900 dark:text-white placeholder-slate-450 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent transition-all"
            placeholder="••••••••"
          />
        </div>
      </div>

      <div class="pt-2">
        <button
          type="submit"
          [disabled]="isLoading()"
          class="relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-semibold rounded-xl text-white bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed transition-all shadow-md dark:shadow-lg dark:shadow-indigo-500/20"
        >
          @if (isLoading()) {
            <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Creating Account...
          } @else {
            Register
          }
        </button>
      </div>
    </form>

    <div class="text-center mt-4">
      <p class="text-sm text-slate-500 dark:text-slate-400">
        Already have an account?
        <a routerLink="/login" class="font-semibold text-violet-600 dark:text-violet-400 hover:text-violet-500 dark:hover:text-violet-350 transition-colors">
          Sign in here
        </a>
      </p>
    </div>
  </div>
</div>
